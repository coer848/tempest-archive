# Configuración de Supabase CLI para Tempest Archive
# Nota: En local no se ejecuta `supabase start` (Docker) por límite de RAM (3.84 GB).
# Se usa `supabase link` y `supabase db push` contra el proyecto `tempest-dev` en la nube.

project_id = "tempest-archive"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "https://*.vercel.app/auth/callback"
]
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
